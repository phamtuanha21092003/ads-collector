[program:mq-consumer]
command=/home/ha-dev/Development/ads-collertor/.venv/bin/python main.py
directory=/home/ha-dev/Development/ads-collertor
numprocs=30
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=10
stopsignal=TERM
stderr_logfile=/var/log/mq-consumer/%(process_num)02d-err.log
stdout_logfile=/var/log/mq-consumer/%(process_num)02d-out.log
stderr_logfile_maxbytes=10MB
stdout_logfile_maxbytes=10MB
stderr_logfile_backups=5
stdout_logfile_backups=5
user=ha-dev
environment=PYTHONUNBUFFERED=1
